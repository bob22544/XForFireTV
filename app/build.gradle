plugins { id 'com.android.application' }

android {
    namespace 'tv.xremote'
    compileSdk 35
    defaultConfig {
        applicationId 'tv.xremote'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '1.2'
    }

    // GitHub Actions uses a persistent release key when repository secrets are
    // configured. Without those secrets, local builds remain easy with debug signing.
    signingConfigs {
        release {
            def ksPath = System.getenv('RELEASE_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('RELEASE_KEYSTORE_PATH') != null && !System.getenv('RELEASE_KEYSTORE_PATH').isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
